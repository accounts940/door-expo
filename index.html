*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid #e3e8e5}
.top img{height:40px}.who{margin-left:auto;text-align:right;line-height:1.25}.who b{font-size:14px;display:block}
.badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 8px;border-radius:20px;background:#e6f4ea;color:var(--dg);text-transform:uppercase}.badge.adm{background:#fde8e9;color:var(--red)}
.xbtn{border:0;background:#eef1f6;border-radius:12px;width:42px;height:42px;font-size:18px}.hide{display:none!important}
main{max-width:1040px;margin:auto;padding:14px;animation:up .35s ease}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero{border-radius:22px;color:#fff;padding:22px 20px;margin-bottom:14px;background:linear-gradient(100deg,#0c1650ee 0,#0b5d34c0 65%,#0b5d3455),var(--hero) center/cover;box-shadow:0 10px 30px #14226b33}
.hero h2{margin:0 0 4px;font-size:22px}.hero p{margin:0;opacity:.92;font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.pills span{background:#ffffff26;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #14226b12}
h3{margin:0 0 10px;font-size:18px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:1000px){.grid{grid-template-columns:repeat(6,1fr)}}
.stat{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 12px #14226b12;border-top:4px solid var(--green)}.stat:nth-child(3n+2){border-color:var(--navy)}.stat:nth-child(3n){border-color:var(--red)}
.stat b{display:block;font-size:28px;color:var(--navy)}.stat span{font-size:12px;color:var(--mu)}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;min-height:48px;padding:12px 14px;border:1.5px solid #d6dde8;border-radius:14px;font-size:16px;background:#fff;color:var(--tx);font-family:inherit;transition:.2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--green);box-shadow:0 0 0 4px #1f9d5520}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border:0;border-radius:14px;font-size:16px;font-weight:700;color:#fff;background:var(--navy);cursor:pointer;transition:.2s;margin-top:12px}
.btn:active{transform:scale(.97)}.btn.r{background:linear-gradient(135deg,var(--red),#f0463b)}.btn.g{background:linear-gradient(135deg,var(--dg),var(--green))}.btn.w{width:100%}.btn:disabled{opacity:.45}.btn.l{background:#eef1f6;color:var(--navy)}
.f2{display:grid;grid-template-columns:1fr;gap:0 12px}@media(min-width:640px){.f2{grid-template-columns:1fr 1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips label{margin:0;position:relative}.chips input{position:absolute;opacity:0;width:0;min-height:0}
.chips span{display:block;padding:9px 14px;border-radius:30px;border:1.5px solid #d6dde8;font-size:13px;font-weight:600;color:var(--tx);transition:.2s}.chips input:checked+span{background:var(--green);border-color:var(--green);color:#fff}
.tiles{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:560px){.tiles{grid-template-columns:1fr 1fr}}
.tile{border:2px dashed #b9c4d6;border-radius:20px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;position:relative;overflow:hidden;text-align:center;padding:14px;transition:.2s}
.tile.has{border:2px solid var(--green);padding:0}.tile>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile h4{margin:0 0 2px;color:var(--navy);font-size:16px}.tile small{color:var(--mu)}
.mini{display:inline-flex;align-items:center;gap:6px;padding:11px 16px;margin:8px 4px 0;background:var(--navy);color:#fff;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}.mini.o{background:var(--green)}.mini input{display:none}
.ov{position:absolute;left:0;right:0;bottom:0;padding:6px;background:linear-gradient(transparent,#000a);display:flex;justify-content:center}
.item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 2px 10px #14226b10;cursor:pointer;transition:.2s}.item:active{transform:scale(.985)}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--navy),#3a52c4);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.mid{flex:1;min-width:0}.mid b,.mid small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mid small{color:var(--mu);font-size:12px}.mid .by{color:var(--dg);font-weight:600}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}.call{width:36px;height:36px;border-radius:50%;background:#e6f4ea;display:grid;place-items:center;text-decoration:none}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:#eef1f6;color:var(--navy);white-space:nowrap}
.s-New{background:#e3ebff;color:#2749c9}.s-Contacted{background:#e8f0fe;color:#1a56b0}.s-Interested{background:#e6f4ea;color:var(--dg)}.s-FollowupRequired{background:#fff3cd;color:#8a6100}.s-QuotationSent{background:#efe3ff;color:#6a2cb5}.s-Negotiation{background:#ffe9d6;color:#b25200}.s-Converted{background:var(--green);color:#fff}.s-NotInterested{background:#fde8e9;color:var(--red)}
.rank{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#fff;margin-bottom:10px;box-shadow:0 2px 10px #14226b10}.rank.me{border:2px solid var(--green)}
.rank .n{font-size:24px;width:38px;text-align:center;font-weight:800;color:var(--navy)}.rank .st{margin-left:auto;display:flex;gap:14px;text-align:center;font-size:11px;color:var(--mu)}.rank .st b{display:block;font-size:18px;color:var(--navy)}
.bar2{margin:8px 0;font-size:13px}.bar2 div{height:9px;border-radius:6px;background:linear-gradient(90deg,var(--dg),var(--green));margin-top:3px;transition:width .6s}
.warn{background:#fff3cd;color:#6b4b00;border-radius:12px;padding:12px;margin:10px 0;font-size:14px}.thumbs{display:flex;gap:10px}.thumbs img{flex:1;min-width:0;max-height:170px;object-fit:cover;border-radius:12px}
.sec{font-size:12px;font-weight:800;letter-spacing:.6px;color:var(--mu);text-transform:uppercase;margin:16px 4px 8px}.sec.red{color:var(--red)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:flex-end;background:#fff;border-top:1px solid #e3e8e5;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px #14226b14;max-width:760px;margin:auto;border-radius:22px 22px 0 0}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);min-height:54px;border-radius:12px;transition:.2s;font-family:inherit}.nav i{font-style:normal;font-size:22px;transition:.2s}.nav .on{color:var(--navy);font-weight:800}.nav .on i{transform:translateY(-2px) scale(1.12)}
.nav .fab{flex:0 0 72px;margin-top:-28px;color:var(--red);font-weight:800}.nav .fab i{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--red),#ff5a48);color:#fff;display:grid;place-items:center;font-size:27px;box-shadow:0 8px 20px #d6202766}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--navy2);color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:50;max-width:90%}#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:var(--red)}
.sp{width:34px;height:34px;border:4px solid #dfe6e1;border-top-color:var(--green);border-radius:50%;animation:s .8s linear infinite;margin:30px auto}@keyframes s{to{transform:rotate(360deg)}}
.lg{max-width:420px;margin:10px auto}.err{color:var(--red);font-size:14px;margin-top:8px}.full{width:100%;border-radius:14px;margin-top:8px}

async function init(){
  const{data:{session}}=await sb.auth.getSession();if(!session)return login();
  const{data}=await sb.from("expo_salespeople").select("*").eq("id",session.user.id).maybeSingle();
  if(!data||!data.active){setUI(false);M(`<div class="card lg"><h3>Not registered</h3><p>Your account is not part of the Expo CRM. Please ask the admin to add you.</p><button class="btn w" onclick="out()">Sign out</button></div>`);return}
  me=data;setUI(true);
  const T=isAdm()?[["adm","📊","Overview"],["all","🗂️","All"],["up","📷","Scan"],["lb","🏆","Rank"],["emp","🧑‍💼","Team"]]:[["dash","🏠","Home"],["cus","👥","Customers"],["up","📷","Scan"],["fu","📅","Follow-ups"],["lb","🏆","Rank"]];
  $("#nav").innerHTML=T.map(t=>`<button data-p="${t[0]}" class="${t[0]==="up"?"fab":""}"><i>${t[1]}</i>${t[2]}</button>`).join("");

function setUI(on){$("#who").classList.toggle("hide",!on);$("#lo").classList.toggle("hide",!on);$("#nav").classList.toggle("hide",!on);
  if(on)$("#who").innerHTML=`<b>${esc(me.full_name)}</b><span class="badge ${isAdm()?"adm":""}">${isAdm()?"Management":"Salesperson"}</span>`}
$("#lo").onclick=()=>out();
function login(){setUI(false);M(`${HERO}<div class="card lg"><h3>Welcome 👋</h3><label>Email</label><input id="e" type="email" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password"><button class="btn r w" id="lgb">Login</button><div id="le" class="err"></div></div>`);
  const go=async()=>{$("#lgb").disabled=true;const{error}=await sb.auth.signInWithPassword({email:$("#e").value.trim(),password:$("#p").value});if(error){$("#le").textContent=error.message;$("#lgb").disabled=false}else init()};
  $("#lgb").onclick=go;$("#p").onkeydown=e=>e.key==="Enter"&&go()}
async function out(){await sb.auth.signOut();me=null;login()}
function go(p){last=p;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));M(spin);({dash,up,cus,fu,lb,adm,all,emp})[p]()}

  const{data:c=[]}=await sb.from("expo_customers").select("id,customer_name,company_name,city,mobile,lead_status,next_followup_date,card_image_path").eq("salesperson_id",me.id).order("created_at",{ascending:false});
  const pend=c.filter(x=>x.next_followup_date&&x.next_followup_date<=today()&&!["Converted","Not Interested"].includes(x.lead_status)).length,n=s=>c.filter(x=>x.lead_status===s).length;
  M(`${HERO}<div class="grid">${stat("My Total Visitors",c.length)}${stat("Cards Uploaded",c.filter(x=>x.card_image_path).length)}${stat("My New Leads",n("New"))}${stat("My Interested",n("Interested"))}${stat("My Converted",n("Converted"))}${stat("Pending Follow-ups",pend)}</div>
  <button class="btn r w" onclick="go('up')" style="font-size:18px;min-height:58px">📷 Scan Visiting Card</button><div class="sec">Recent cards</div>${c.slice(0,5).map(row).join("")||'<div class="card">No visitors yet. Tap Scan to add the first one.</div>'}`)}

function tile(s,t,sub){const f=imgs[s];return `<div class="tile ${f?"has":""}" id="t-${s}">${f?`<img src="${f.url}"><div class="ov">`:`<div style="font-size:34px">${s==="front"?"🪪":"🔄"}</div><h4>${t}</h4><small>${sub}</small><div>`}<label class="mini o">📷 ${f?"Retake":"Camera"}<input type="file" accept="image/*" capture="environment" data-s="${s}"></label><label class="mini">🖼 Gallery<input type="file" accept="image/*" data-s="${s}"></label></div></div>`}
function up(){imgs={front:null,back:null};ext={};
  M(`<div class="card"><h3>Scan Visiting Card</h3><p style="margin:0 0 12px;color:var(--mu);font-size:14px">Add the front. If the card has details on the back too, add the back side as well.</p><div class="tiles">${tile("front","Front side","Required")}${tile("back","Back side","Optional")}</div><button class="btn g w" id="ex" disabled>✨ Extract details with AI</button><div id="st" class="err"></div></div>`);
  $("#ex").onclick=extract}
document.addEventListener("change",async e=>{const i=e.target.closest("input[data-s]");if(!i||!i.files[0])return;const s=i.dataset.s,b=await compress(i.files[0]);
  imgs[s]={blob:b,url:URL.createObjectURL(b)};$("#t-"+s).outerHTML=tile(s,s==="front"?"Front side":"Back side",s==="front"?"Required":"Optional");$("#ex").disabled=!imgs.front});
function compress(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1500/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(r,"image/jpeg",.8)};i.src=URL.createObjectURL(f)})}
const b64=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(",")[1]);fr.readAsDataURL(b)});
async function extract(){const st=$("#st"),bt=$("#ex");st.style.color="var(--navy)";st.textContent="Reading the card…";bt.disabled=true;
  try{const{data:{session}}=await sb.auth.getSession(),list=[imgs.front,imgs.back].filter(Boolean);
    const images=await Promise.all(list.map(async x=>({data:await b64(x.blob),mime:"image/jpeg"})));
    const r=await fetch(EXTRACT_URL,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token,apikey:SUPABASE_ANON_KEY},body:JSON.stringify({images})});
    if(!r.ok)throw new Error("Extraction failed ("+r.status+")");ext=await r.json();verify()}
  catch(e){st.style.color="var(--red)";st.innerHTML=`${esc(e.message)}. Retake the photo or <a href="#" onclick="ext={};verify();return false">enter details manually</a>.`;bt.disabled=false}}

function form(c,pr){return `<div class="f2">${FIELDS.map(([k,l])=>`<div><label>${l}</label><input data-k="${k}" value="${esc(c[k])}"></div>`).join("")}</div>
<label>Interested products</label><div class="chips" id="pr">${PRODUCTS.map(p=>`<label><input type="checkbox" value="${p}" ${pr.includes(p)?"checked":""}><span>${p}</span></label>`).join("")}</div>
<label>Customer requirements</label><textarea data-k="requirements" rows="2">${esc(c.requirements)}</textarea>
<div class="f2"><div><label>Estimated business potential</label><input data-k="business_potential" value="${esc(c.business_potential)}"></div><div><label>Lead status</label><select data-k="lead_status">${STATUS.map(s=>`<option ${s===(c.lead_status||"New")?"selected":""}>${s}</option>`).join("")}</select></div><div><label>Next follow-up date</label><input type="date" data-k="next_followup_date" value="${c.next_followup_date||""}"></div></div>
<label>Remarks</label><textarea data-k="remarks" rows="3">${esc(c.remarks)}</textarea>`}
const read=()=>{const o={};document.querySelectorAll("[data-k]").forEach(e=>o[e.dataset.k]=e.value.trim()||null);return o},prods=()=>[...document.querySelectorAll("#pr input:checked")].map(x=>x.value);

async function verify(){
  M(`<div class="card"><h3>Check &amp; Confirm</h3><div class="thumbs">${[imgs.front,imgs.back].filter(Boolean).map(x=>`<img src="${x.url}">`).join("")}</div><div id="dp"></div>${form(ext,[])}<button class="btn g w" id="sv">✅ Confirm &amp; Save</button><button class="btn l w" onclick="go('up')">Cancel</button></div>`);
  const{data:n}=await sb.rpc("expo_check_duplicate",{p_mobile:ext.mobile||"",p_email:ext.email||"",p_company:ext.company_name||""});
  if(n>0)$("#dp").innerHTML=`<div class="warn">⚠️ Possible duplicate: this mobile, email or company already exists in the Expo database. Management will review it. You can still save.</div>`;
  $("#sv").onclick=async()=>{const v=read(),bt=$("#sv");bt.disabled=true;const P={};
    for(const s of ["front","back"])if(imgs[s]){const path=`${me.id}/${crypto.randomUUID()}_${s}.jpg`,{error}=await sb.storage.from("expo-cards").upload(path,imgs[s].blob,{contentType:"image/jpeg"});if(error){toast(error.message,1);bt.disabled=false;return}P[s]=path}
    const{data,error}=await sb.from("expo_customers").insert({...v,card_image_path:P.front||null,card_back_path:P.back||null}).select("id").single();
    if(error){toast(error.message,1);bt.disabled=false;return}
    const p=prods();if(p.length)await sb.from("expo_customer_products").insert(p.map(x=>({customer_id:data.id,product:x})));
    if(v.next_followup_date)await sb.from("expo_followups").insert({customer_id:data.id,due_date:v.next_followup_date,note:v.remarks});
    toast("Saved ✓ Customer added");go(isAdm()?"all":"cus")}}

function cus(){L={uid:me.id,page:0};listUI()}
function all(){L={uid:null,page:0};listUI(true)}
function listUI(adm){M(`<input id="q" placeholder="🔍 Search name, company, mobile…"><select id="fs" style="margin-top:8px"><option value="">All statuses</option>${STATUS.map(s=>`<option>${s}</option>`).join("")}</select>${adm?'<button class="btn l w" id="csv">⬇ Export CSV</button>':""}<div id="ls" style="margin-top:12px"></div>`);
  let t;$("#q").oninput=()=>{clearTimeout(t);t=setTimeout(()=>{L.page=0;load(true)},300)};$("#fs").onchange=()=>{L.page=0;load(true)};if(adm)$("#csv").onclick=csv;load(true)}
async function load(reset){const el=$("#ls");if(reset)el.innerHTML=spin;
  let q=sb.from("expo_customers").select("id,customer_name,company_name,mobile,lead_status,city,expo_salespeople(full_name)",{count:"exact"}).order("created_at",{ascending:false}).range(L.page*20,L.page*20+19);
  if(L.uid)q=q.eq("salesperson_id",L.uid);const s=($("#q").value||"").replace(/[,()%]/g,""),f=$("#fs").value;
  if(s)q=q.or(`customer_name.ilike.%${s}%,company_name.ilike.%${s}%,mobile.ilike.%${s}%`);if(f)q=q.eq("lead_status",f);
  const{data=[],count}=await q;if(reset)el.innerHTML="";el.querySelector("#mr")?.remove();
  el.insertAdjacentHTML("beforeend",data.map(row).join("")||(reset?'<div class="card">No customers found.</div>':""));
  if((L.page+1)*20<count)el.insertAdjacentHTML("beforeend",`<button class="btn l w" id="mr">Load more (${count-(L.page+1)*20})</button>`),$("#mr").onclick=()=>{L.page++;load(false)}}
async function csv(){const{data=[]}=await sb.from("expo_customers").select("*,expo_salespeople(full_name)").order("created_at").limit(5000);if(!data.length)return toast("Nothing to export",1);
  const rows=data.map(r=>{const{expo_salespeople:s,...o}=r;return{salesperson:s?.full_name,...o}}),k=Object.keys(rows[0]),q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+[k.join(","),...rows.map(r=>k.map(x=>q(r[x])).join(","))].join("\n")],{type:"text/csv"}));a.download="selmex_expo_customers.csv";a.click()}

async function signed(p){if(!p)return"";const{data}=await sb.storage.from("expo-cards").createSignedUrl(p,300);return data?.signedUrl||""}
async function detail(id){M(spin);
  const{data:c}=await sb.from("expo_customers").select("*,expo_salespeople(full_name)").eq("id",id).single();
  const{data:p=[]}=await sb.from("expo_customer_products").select("product").eq("customer_id",id);
  const[f,b]=await Promise.all([signed(c.card_image_path),signed(c.card_back_path)]),wa=(c.alternate_mobile||c.mobile||"").replace(/\D/g,"");
  M(`<button class="btn l" onclick="go(last)" style="margin:0 0 10px">‹ Back</button><div class="card"><h3>${esc(c.customer_name||"Customer")}</h3>${c.expo_salespeople?`<p style="margin:0 0 8px;color:var(--dg);font-weight:600">👤 Collected by ${esc(c.expo_salespeople.full_name)}</p>`:""}
  ${c.mobile?`<a class="btn g" href="tel:${esc(c.mobile)}" style="text-decoration:none;margin:0 8px 8px 0">📞 Call</a>`:""}${wa?`<a class="btn" href="https://wa.me/${wa.length===10?"91"+wa:wa}" target="_blank" style="text-decoration:none;margin:0 0 8px">💬 WhatsApp</a>`:""}
  <div class="thumbs">${f?`<img src="${f}">`:""}${b?`<img src="${b}">`:""}</div>${form(c,p.map(x=>x.product))}<button class="btn g w" id="sv">Save changes</button></div>`);
  $("#sv").onclick=async()=>{const v=read(),{error}=await sb.from("expo_customers").update(v).eq("id",id);
    if(!error){await sb.from("expo_customer_products").delete().eq("customer_id",id);const pr=prods();if(pr.length)await sb.from("expo_customer_products").insert(pr.map(x=>({customer_id:id,product:x})))}
    error?toast(error.message,1):toast("Saved ✓")}}

async function fu(){const{data=[]}=await sb.from("expo_customers").select("id,customer_name,company_name,city,mobile,lead_status,next_followup_date").eq("salesperson_id",me.id).not("next_followup_date","is",null).order("next_followup_date"),t=today();
  const g=(h,a,c)=>a.length?`<div class="sec ${c||""}">${h} · ${a.length}</div>${a.map(x=>row(x)).join("")}`:"";
  M(`<h3>📅 My Follow-ups</h3>${g("Overdue",data.filter(x=>x.next_followup_date<t),"red")}${g("Today",data.filter(x=>x.next_followup_date===t))}${g("Upcoming",data.filter(x=>x.next_followup_date>t))}${data.length?"":'<div class="card">No follow-ups scheduled.</div>'}`)}

async function lb(){const{data=[]}=await sb.rpc("expo_leaderboard"),m=["🥇","🥈","🥉"];
  M(`<h3>🏆 Salesperson Leaderboard</h3><p style="color:var(--mu);font-size:13px;margin:-4px 0 12px">Only totals are shown. Customer details stay private.</p>${data.map(r=>`<div class="rank ${r.full_name===me.full_name?"me":""}"><div class="n">${m[r.rank-1]||r.rank}</div><div class="mid"><b>${esc(r.full_name)}${r.full_name===me.full_name?" (you)":""}</b></div><div class="st"><div><b>${r.total}</b>Customers</div><div><b>${r.interested}</b>Interested</div><div><b>${r.converted}</b>Converted</div></div></div>`).join("")||'<div class="card">No data yet.</div>'}`)}

async function adm(){const[{data:c=[]},{data:pr=[]},{data:l=[]}]=await Promise.all([sb.from("expo_customers").select("lead_status,city,industry,next_followup_date,card_image_path"),sb.from("expo_customer_products").select("product"),sb.rpc("expo_leaderboard")]);
  const cnt=(a,f)=>Object.entries(a.reduce((o,x)=>{const k=f(x)||"Unknown";o[k]=(o[k]||0)+1;return o},{})).sort((a,b)=>b[1]-a[1]).slice(0,7),
  box=(t,r)=>{const mx=r[0]?r[0][1]:1;return `<div class="card"><h3 style="font-size:16px">${t}</h3>${r.map(x=>`<div class="bar2">${esc(x[0])} <b style="float:right">${x[1]}</b><div style="width:${Math.max(6,x[1]/mx*100)}%"></div></div>`).join("")||"<small>No data</small>"}</div>`};
  M(`${HERO}<div class="grid">${stat("Registered Customers",c.length)}${stat("Cards Uploaded",c.filter(x=>x.card_image_path).length)}${stat("Interested",c.filter(x=>x.lead_status==="Interested").length)}${stat("Converted",c.filter(x=>x.lead_status==="Converted").length)}${stat("Follow-ups Pending",c.filter(x=>x.next_followup_date&&x.next_followup_date<=today()).length)}${stat("Team Members",l.length)}</div>
  ${box("Salesperson-wise customers",l.map(r=>[r.full_name,r.total]))}${box("Product-wise interest",cnt(pr,x=>x.product))}${box("Industry-wise",cnt(c,x=>x.industry))}${box("City-wise",cnt(c,x=>x.city))}`)}

async function emp(){const{data=[]}=await sb.from("expo_salespeople").select("*").order("role").order("full_name");
  M(`<h3>🧑‍💼 Team</h3>${data.map(s=>`<div class="item" style="cursor:default"><div class="av">${esc(s.full_name.charAt(0).toUpperCase())}</div><div class="mid"><b>${esc(s.full_name)}</b><span class="badge ${s.role==="admin"?"adm":""}">${s.role==="admin"?"Management":"Salesperson"}</span></div><div class="rt"><select onchange="upd('${s.id}',{role:this.value})" style="min-height:38px;padding:4px 8px;font-size:13px"><option value="salesperson" ${s.role!=="admin"?"selected":""}>Salesperson</option><option value="admin" ${s.role==="admin"?"selected":""}>Management</option></select><label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:20px;min-height:20px" ${s.active?"checked":""} onchange="upd('${s.id}',{active:this.checked})">Active</label></div></div>`).join("")}
  <div class="card"><h3 style="font-size:16px">Add team member</h3><p style="font-size:12px;color:var(--mu)">Create the login in Supabase Authentication first, then paste the user UUID.</p><label>Auth user UUID</label><input id="u"><label>Full name</label><input id="n"><button class="btn g w" id="ad">Add</button></div>`);
  $("#ad").onclick=async()=>{const{error}=await sb.from("expo_salespeople").insert({id:$("#u").value.trim(),full_name:$("#n").value.trim()});error?toast(error.message,1):(toast("Added ✓"),emp())}}
async function upd(id,v){const{error}=await sb.from("expo_salespeople").update(v).eq("id",id);error?toast(error.message,1):toast("Updated ✓")}
init();
</script></body></html>
